server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/books/**
        - id: borrowing-service
          uri: lb://borrowing-service
          predicates:
            - Path=/api/borrowings/**
        - id: fines-service
          uri: lb://fines-service
          predicates:
            - Path=/api/fines/**, /api/reports/**

# لازم نفس قيمة user-service
jwt:
  secret: ${JWT_SECRET:library-system-secret-key-change-me-2026-please}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
